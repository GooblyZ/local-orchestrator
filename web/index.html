<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>שיחת Codex ו-Claude</title>
<style nonce="__NONCE__">
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1d2127;--muted:#5f6672;--line:#e5e3dd;--soft:#f1f0ec;
--codex:#5b3cc4;--codex-soft:#f4f1ff;--codex-line:#ddd5fa;--claude:#b4531a;--claude-soft:#fff6ef;--claude-line:#f6dcc7;
--ok:#177245;--ok-soft:#eaf7ef;--bad:#b42318;--bad-soft:#fdf0ef;--warn:#8a5a00;--warn-soft:#fdf7e6;--human:#7a2cbf;--human-soft:#f7f0fd;
--info:#1f5fa8;--info-soft:#eef5fd;--code-bg:#f7f8fa;--shadow:0 1px 2px rgba(20,20,30,.05),0 4px 14px rgba(20,20,30,.04)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15.5px/1.6 "Segoe UI","Rubik","Assistant","Heebo",Arial,sans-serif}
button,select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer}
button:hover,select:hover{border-color:#bdb9b0}
button:focus-visible,select:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--codex);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:rgba(246,246,243,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.brand{display:flex;gap:10px;align-items:center;flex:1 1 300px;min-width:0}
.pair{display:flex;flex:none}.pair span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 system-ui;border:2px solid var(--bg)}
.pair .cx{background:var(--codex)}.pair .cl{background:var(--claude);margin-inline-start:-8px}
.ttl{min-width:0}
h1{font-size:16.5px;margin:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;unicode-bidi:plaintext}
.sub{font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
.tools select{max-width:320px;min-width:0}
#sideBtn[aria-pressed="true"]{background:var(--soft)}
.layout{max-width:1240px;margin:0 auto;padding:22px 20px 70px;display:grid;grid-template-columns:minmax(0,1fr) 264px;gap:26px;align-items:start}
.layout.noside{grid-template-columns:minmax(0,1fr)}.layout.noside aside{display:none}
main{min-width:0}
aside{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow)}
.card h2{font-size:12.5px;font-weight:700;margin:0 0 8px;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;padding:3px 12px;border-radius:999px}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-live{color:var(--ok);background:var(--ok-soft)}.st-live::before{animation:pulse 1.4s ease-in-out infinite}
.st-saved{color:#454c59;background:var(--soft)}.st-warn{color:var(--warn);background:var(--warn-soft)}.st-replay{color:var(--info);background:var(--info-soft)}
@keyframes pulse{50%{opacity:.25}}
.explain{color:var(--muted);font-size:13px;margin:8px 0 0}
.now{margin-top:12px;font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.who-codex{color:var(--codex)}.who-claude{color:var(--claude)}.who-sys{color:var(--muted)}
.steps{display:flex;gap:4px;margin-top:10px}
.step{flex:1 1 0;text-align:center;font-size:11.5px;padding:5px 2px;border-radius:7px;background:var(--soft);color:var(--muted);border:1px solid transparent}
.step.cur{background:var(--panel);border-color:currentColor;font-weight:700}.step.cur.codex{color:var(--codex)}.step.cur.claude{color:var(--claude)}.step.cur.sys{color:var(--info)}
.meta-line{font-size:12.5px;color:var(--muted);margin-top:6px}
.mono{direction:ltr;text-align:right;font:12px/1.4 ui-monospace,Consolas,monospace;word-break:break-all}
.cycles{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.cycles li{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline}.cycles b{min-width:44px}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.legend div{display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.dot.cx{background:var(--codex)}.dot.cl{background:var(--claude)}
.t-good{color:var(--ok)}.t-bad{color:var(--bad)}.t-no{color:var(--muted)}.t-yes{color:var(--ink)}.t-approve{color:var(--codex)}.t-warn{color:var(--warn)}.t-human{color:var(--human)}
.chat{display:flex;flex-direction:column;gap:16px;max-width:880px;margin-inline:auto}
.mock{display:flex;gap:10px;align-items:center;background:#fff8e1;border:1px dashed #c99a1e;color:#5c4300;border-radius:12px;padding:10px 14px;font-size:14px}
.mtag{flex:none;font:700 11.5px/1 system-ui;letter-spacing:.08em;background:#5c4300;color:#fff;padding:4px 8px;border-radius:5px}
.taskp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow)}
.label{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:3px}
.text{white-space:pre-wrap;word-break:break-word;unicode-bidi:plaintext}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{border:0;background:none;padding:0;color:var(--codex);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.cdiv{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px;font-weight:700;margin-top:4px}
.cdiv::before,.cdiv::after{content:"";flex:1;height:1px;background:var(--line)}
.turn{display:flex;gap:10px;align-items:flex-start;max-width:min(90%,720px)}
.turn.codex{align-self:flex-start}.turn.claude{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px/1 system-ui;margin-top:2px}
.codex .av{background:var(--codex)}.claude .av{background:var(--claude)}
.bub{min-width:0;flex:1;border-radius:16px;padding:12px 15px;border:1px solid;box-shadow:var(--shadow)}
.codex .bub{background:var(--codex-soft);border-color:var(--codex-line);border-start-start-radius:6px}
.claude .bub{background:var(--claude-soft);border-color:var(--claude-line);border-start-end-radius:6px}
.bh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.bh .nm{font-weight:700}.codex .nm{color:var(--codex)}.claude .nm{color:var(--claude)}
.bh .what{font-size:13.5px;color:var(--muted)}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:1px 10px;border-radius:999px}
.c-ok{color:var(--ok);background:var(--ok-soft)}.c-warn{color:var(--warn);background:var(--warn-soft)}.c-bad{color:var(--bad);background:var(--bad-soft)}
.c-human{color:var(--human);background:var(--human-soft)}.c-info{color:var(--info);background:var(--info-soft)}.c-muted{color:var(--muted);background:var(--soft)}.c-approve{color:var(--codex);background:#ece7ff}
.lbl{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.say .tx{font-size:16px;line-height:1.7}
.sysdesc .tx{font-size:14.5px;color:#30363f}
.orig{margin-top:10px;padding:6px 12px 8px;border-inline-start:3px solid rgba(0,0,0,.09);background:rgba(255,255,255,.65);border-radius:6px;font-size:14.5px}
.field{margin-top:8px}.field:first-child{margin-top:2px}
.field ul{margin:2px 0;padding-inline-start:20px}.field li{margin:2px 0}
.panel{margin-top:10px}
.code{direction:ltr;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--code-bg);margin-top:4px;overflow:hidden}
.code-h{direction:rtl;display:flex;gap:8px;align-items:center;justify-content:space-between;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
.code-h .cl{font-size:12.5px;font-weight:700}
.code-h .btns{display:flex;gap:6px}.code-h button{font-size:12px;padding:2px 9px}
pre,.files,.th,.mono{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
pre{margin:0;padding:10px 12px;font:13px/1.55 Consolas,"Courier New",ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;overflow:auto;color:#1f2328}
pre.cut{max-height:18em}
.raw{direction:ltr;text-align:left;margin-top:10px;border:1px dashed #c9c6be;border-radius:10px;background:var(--panel)}
.raw .rl{direction:rtl;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:5px 10px;border-bottom:1px dashed #d9d6cf}
.raw .rl button{font-size:12px;padding:1px 9px}
.bf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.bf .tm{margin-inline-end:auto}
.bf button{font-size:12.5px;padding:2px 11px;background:rgba(255,255,255,.7)}
.bf button[aria-expanded="true"]{background:var(--panel);border-color:#bdb9b0;font-weight:600}
.sys{align-self:center;width:min(100%,640px);border-radius:12px;padding:9px 14px;font-size:14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px}
.sys .sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sys.ok{background:var(--ok-soft);border-color:#c6e7d3}.sys.bad{background:var(--bad-soft);border-color:#f3cdc9}.sys.static{background:var(--info-soft);border-color:#cfe0f5}
.sys.warn{background:var(--warn-soft);border-color:#efe0b4}.sys.human{background:var(--human-soft);border-color:#e6d3f6}
.sys .small,.small{font-size:12.5px;color:var(--muted)}
.files{direction:ltr;text-align:left;font:12.5px ui-monospace,Consolas,monospace;color:#3f4652}
.flist{margin:4px 0 0;padding-inline-start:18px}.flist li{margin:2px 0}.flist .files{unicode-bidi:isolate}
details>summary{cursor:pointer;color:var(--muted);font-size:13px}
details[open]>summary{margin-bottom:6px}
.typing .bub{border-style:dashed;background:var(--panel)}
.dots{display:inline-flex;gap:4px;margin-inline-start:4px}.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.3;animation:d 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}@keyframes d{40%{opacity:1}}
.result{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--muted);border-radius:14px;padding:15px 18px;box-shadow:var(--shadow)}
.result.ok{border-top-color:var(--ok)}.result.review{border-top-color:var(--codex)}.result.static{border-top-color:var(--info)}.result.bad{border-top-color:var(--bad)}
.result .big{font-size:17px;font-weight:700;margin:2px 0 4px}
.ev{list-style:none;margin:12px 0 10px;padding:0;display:grid;gap:5px}
.ev li{display:grid;grid-template-columns:20px 170px minmax(0,1fr);gap:8px;align-items:baseline;font-size:14px;padding:3px 0;border-bottom:1px solid var(--soft)}
.ev .ic{font-weight:700;text-align:center}.ev .k{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:70px 10px}
[hidden]{display:none!important}
.home{max-width:820px;margin:8px auto 0;display:flex;flex-direction:column;gap:18px}
.hero h2{font-size:30px;margin:0;letter-spacing:-.02em}.hero h2 .cx{color:var(--codex)}.hero h2 .cl{color:var(--claude)}
.hero p{margin:6px 0 0;color:var(--muted);font-size:15px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role{border-radius:12px;padding:10px 14px;font-size:14px;border:1px solid}.role b{display:block}
.role.cx{background:var(--codex-soft);border-color:var(--codex-line)}.role.cx b{color:var(--codex)}
.role.cl{background:var(--claude-soft);border-color:var(--claude-line)}.role.cl b{color:var(--claude)}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.ask textarea{width:100%;min-height:150px;resize:vertical;font:inherit;font-size:16px;line-height:1.6;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fcfcfa;color:var(--ink)}
.ask textarea:focus,.ask input:focus,.ask select:focus{outline:2px solid var(--codex);outline-offset:1px}
.ask details{border-top:1px solid var(--soft);padding-top:8px}.ask summary{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:8px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}.fld select,.fld input[type=text]{font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.projbox{display:flex;flex-direction:column;gap:10px;margin-top:8px;padding:12px;border:1px solid var(--claude-line);border-radius:12px;background:var(--claude-soft)}
.rootbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel);font-size:13.5px;margin-bottom:10px}
.rootbar.ex{border-color:var(--claude-line);background:var(--claude-soft)}.rootbar.moved{border-color:#efe0b4;background:var(--warn-soft)}
.rootbar .files{font-weight:600}
.primary{background:var(--codex);color:#fff;border-color:var(--codex);font-size:16px;font-weight:700;padding:10px 26px;border-radius:12px}
.primary:hover{filter:brightness(1.07)}.primary:disabled{opacity:.45;cursor:not-allowed}
.danger{color:var(--bad);border-color:#efc9c4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.err{color:var(--bad);font-size:14px;white-space:pre-wrap}
.confirm{border:2px solid var(--codex-line);border-radius:16px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 12px;font-size:14px}.kv .k{color:var(--muted)}
.risk{background:var(--warn-soft);border:1px solid #efe0b4;border-radius:10px;padding:10px 12px;font-size:14px}
.recent{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.recent a{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);text-decoration:none;font-size:14px}
.recent a:hover{border-color:#bdb9b0}.recent .small{white-space:nowrap}
.appbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.perm{border:2px solid var(--human);background:var(--human-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.perm .item{background:var(--panel);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.goal{display:flex;flex-direction:column;gap:6px;font-size:13px}.goal .crit{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.goal .crit li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px}.goal .bar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--codex)}
.budget{border:2px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.seg2{display:flex;gap:8px;flex-wrap:wrap}.seg2 label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--panel);font-size:14px}
.filesbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.ov{background:var(--panel);border:1px solid var(--line);border-inline-start:5px solid var(--muted);border-radius:16px;box-shadow:var(--shadow);padding:14px 18px;display:grid;gap:10px}
.ov.t-live{border-inline-start-color:var(--info)}.ov.t-need{border-inline-start-color:var(--warn);background:linear-gradient(270deg,var(--warn-soft),var(--panel) 60%)}
.ov.t-ok{border-inline-start-color:var(--ok)}.ov.t-mid{border-inline-start-color:var(--codex)}.ov.t-bad{border-inline-start-color:var(--bad)}
.ov .oh{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}.ov .ot{font-size:19px;font-weight:700;letter-spacing:-.01em}
.ov .os{color:var(--muted)}.ov .ofacts{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13.5px}
.ov .ofacts .bar{width:110px;display:inline-block;vertical-align:middle;margin-inline-start:6px}
.ov .oai{background:var(--soft);border-radius:12px;padding:10px 13px;display:grid;gap:6px}
.ov .oai .lbl{font-size:12.5px;color:var(--muted)}.ov .oai .bl{font-weight:600;line-height:1.55}
.ov .onext{border-inline-start:3px solid var(--codex);padding:2px 10px}
.ov .osince{border-top:1px dashed var(--line);padding-top:8px}.ov .osince ul{margin:4px 0 0;padding-inline-start:20px}
.ov .olinks{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.ov .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
.ov.t-live .dot{background:var(--info);animation:pulse 1.6s infinite}.ov.t-need .dot{background:var(--warn)}.ov.t-ok .dot{background:var(--ok)}.ov.t-bad .dot{background:var(--bad)}.ov.t-mid .dot{background:var(--codex)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}@media (prefers-reduced-motion:reduce){.ov.t-live .dot{animation:none}}
.dec{display:grid;gap:8px}.dec .why{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.dec .opt{display:grid;gap:2px}.dec .opt .small{margin-inline-start:2px}
.recent .needs{color:var(--warn);font-weight:700}
.cont{border:1px solid var(--codex-line);background:var(--panel);border-radius:14px;padding:14px 16px;display:grid;gap:10px;box-shadow:var(--shadow)}
.cont .bud{display:grid;gap:3px;background:var(--soft);border-radius:10px;padding:9px 12px}
.cont textarea{width:100%;min-height:110px;resize:vertical;font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel);color:var(--ink)}
.cont .ext{display:flex;flex-wrap:wrap;gap:6px 14px}.cont .ext label{display:flex;gap:6px;align-items:center}
.cont ul{margin:0;padding-inline-start:20px}.recent .kind{color:var(--muted)}
.attn{border:2px solid var(--warn);background:var(--warn-soft);border-radius:14px;padding:10px 14px;display:grid;gap:6px}
.sumcard{background:var(--panel);border:1px solid var(--codex-line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sumcard>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 16px;background:linear-gradient(270deg,var(--codex-soft),var(--panel))}
.sumcard>summary::-webkit-details-marker{display:none}
.sumcard>summary .ttl{font-weight:700;font-size:16.5px}
.sumcard>summary .ttl::before{content:"▸ ";color:var(--muted)}.sumcard[open]>summary .ttl::before{content:"▾ "}
.sumcard .sbody{padding:6px 16px 14px;display:grid;gap:10px}
.sumcard h4{margin:4px 0 2px;font-size:13.5px;color:var(--muted);font-weight:700}
.sumcard ul{margin:0;padding-inline-start:20px}.sumcard li{margin:2px 0}
.sumcard .bl{background:var(--soft);border-radius:12px;padding:10px 13px;font-weight:600;line-height:1.55}
.sumcard .nx{border-inline-start:3px solid var(--codex);padding:4px 10px}
.sumcard .stale{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px}
.sumcard .facts{border-top:1px dashed var(--line);padding-top:8px}
.sumcard .sg-v{color:var(--ok);font-weight:700}.sumcard .sg-u{color:var(--warn);font-weight:700}.sumcard .sg-h{color:var(--info);font-weight:700}
@media (max-width:640px){.roles,.grid2{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.hero h2{font-size:24px}}

  es.addEventListener("activity", ev => { const a = JSON.parse(ev.data); if ((a.eseq || 0) > S.lastE) { S.activity.push(a); S.lastE = Math.max(S.lastE, a.eseq || 0); schedule(); } });
  es.addEventListener("sysevent", ev => { const e = JSON.parse(ev.data); if ((e.eseq || 0) > S.lastE) { S.events.push(e); S.lastE = Math.max(S.lastE, e.eseq || 0); schedule(); } });
  es.addEventListener("status", ev => { S.status = JSON.parse(ev.data); schedule(); });
  es.onerror = () => { UI.errors++; setConn(false, UI.errors > 3 ? "החיבור לשרת המקומי נותק — מה שכבר נטען נשאר בדף. לפתיחה מחדש: python orchestrator.py serve" : "מתחבר מחדש לשרת המקומי..."); };
}
async function load() {
  S.tasks = (await api("/api/tasks")).tasks;
  const sel = $("taskSel"); sel.replaceChildren();
  if (APP) { $("homeBtn").hidden = false; $("homeBtn").onclick = goHome; document.querySelector("footer .fx").textContent = "127.0.0.1 בלבד · פעולות דורשות אישור שלך · מוצג בדיוק מה שנשמר (סודות מוסתרים)"; }
  if (APP && !taskId) return renderHome();
  if (!taskId && S.tasks.length) taskId = S.tasks[0].id;
  for (const t of S.tasks) sel.append(h("option", {value: t.id, text: optText(t)}));
  if (!taskId) { $("main").replaceChildren(h("div", {class: "empty", text: "עדיין אין שיחות שמורות. השיחה תופיע כאן כשמשימה תתחיל."})); setTimeout(() => location.reload(), 2000); return; }
  if (![...sel.options].some(o => o.value === taskId)) sel.append(h("option", {value: taskId, text: "ממתין · " + iso(taskId)}));
  sel.value = taskId;
  sel.onchange = () => { const u = new URL(location.href); u.searchParams.set("task", sel.value); location.href = u.toString(); };
  let snap = null;
  for (let i = 0; i < 240 && !snap; i++) { try { snap = await api("/api/snapshot", "&task=" + encodeURIComponent(taskId)); } catch (e) { await new Promise(r => setTimeout(r, 500)); } }
  if (!snap) { $("main").replaceChildren(h("div", {class: "empty", text: "לא ניתן לטעון את השיחה."})); return; }
  Object.assign(S, {messages: snap.messages, activity: snap.activity, events: snap.events || [], attachments: snap.attachments || [], status: snap.status});
  S.lastSeq = Math.max(0, ...S.messages.map(m => m.seq));
  S.lastE = Math.max(0, ...S.activity.map(a => a.eseq || 0), ...S.events.map(e => e.eseq || 0));
  document.title = mockPrefix(snap.status.short_title || taskId, snap.status.is_mock) + " · שיחת Codex ו-Claude";
  render();
  const ask = document.querySelector("#main section[role=alert], #main .perm");  /* a decision is waiting: show it, not the top */
  if (ask) ask.scrollIntoView({block: "center"}); else window.scrollTo(0, 0);
  connect();
}
function setMode(m) { UI.mode = m; try { localStorage.setItem("orchViewerMode", m); } catch (e) {} render(); }
$("modeConv").onclick = () => setMode("conv");
$("modeTech").onclick = () => setMode("tech");
$("sideBtn").onclick = () => { UI.side = !UI.side; try { localStorage.setItem("orchViewerSide", UI.side ? "1" : "0"); } catch (e) {} render(); };
$("replayBtn").onclick = async () => {
  if (UI.replay) { UI.replay.stop = true; return; }
  UI.replay = {n: 0, stop: false}; $("replayBtn").textContent = "■ עצור הפעלה חוזרת"; render(); window.scrollTo(0, 0);
  while (UI.replay && !UI.replay.stop && UI.replay.n < S.messages.length) {
    await new Promise(r => setTimeout(r, parseInt($("speed").value, 10)));
    if (!UI.replay || UI.replay.stop) break;
    UI.replay.n++; render(); window.scrollTo(0, document.body.scrollHeight);
  }
  UI.replay = null; $("replayBtn").textContent = "▶ הפעלה חוזרת"; render();
};
load().catch(e => { $("main").replaceChildren(h("div", {class: "empty", text: "שגיאה בטעינה: " + e.message})); });
</script>
